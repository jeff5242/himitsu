name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:no-hardcode
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.example.com
          VITE_SUPABASE_KEY: placeholder
