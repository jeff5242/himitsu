server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback：React Router 的路徑（/o/…、/invite/…）一律回 index.html
  location / {
    try_files $uri /index.html;
  }

  # 帶 hash 的資產可長快取
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
